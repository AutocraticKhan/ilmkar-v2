<aside class="sidebar">
  <div class="brand">
    <span class="mark">ILMKAR</span>
    <span class="sub">{{ school.name }}</span>
  </div>
  <nav class="nav">
    <a class="{% if nav_active == 'overview' %}active{% endif %}" href="{% url 'School_Admin:dashboard' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-8h6v8"/></svg>
      Dashboard
    </a>
    <a class="{% if nav_active == 'students' %}active{% endif %}" href="{% url 'School_Admin:students' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 8v5"/></svg>
      Students
    </a>
    <a class="{% if nav_active == 'staff' %}active{% endif %}" href="{% url 'School_Admin:staff' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c1.3-3.6 4.1-5.5 6.5-5.5s5.2 1.9 6.5 5.5"/><path d="M16 8h6M19 5v6"/></svg>
      Staff
    </a>
    <a class="{% if nav_active == 'fees' %}active{% endif %}" href="{% url 'School_Admin:fees' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M17 5.5c-1-1-2.8-1.5-5-1.5-3 0-5 1.3-5 3.5S9 11 12 11s5 1.3 5 3.5-2 3.5-5 3.5c-2.2 0-4-.5-5-1.5"/></svg>
      Fees
    </a>
    <a class="{% if nav_active == 'approvals' %}active{% endif %}" href="{% url 'School_Admin:approvals' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6 9 17l-5-5"/></svg>
      Approvals
      {% if pending_approvals %}<span class="nav-badge">{{ pending_approvals }}</span>{% endif %}
    </a>
    <a class="{% if nav_active == 'reports' %}active{% endif %}" href="{% url 'School_Admin:reports' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-3-6 3V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Reports
    </a>
    <a class="{% if nav_active == 'notices' %}active{% endif %}" href="{% url 'School_Admin:notices' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10v4l11 5V5L3 10Z"/><path d="M14 8.5c2.5.5 4 1.8 4 3.5s-1.5 3-4 3.5"/><path d="M7 14.5V19a1.5 1.5 0 0 0 3 0v-3"/></svg>
      Notices
    </a>
    <a class="{% if nav_active == 'frontdesk' %}active{% endif %}" href="{% url 'School_Admin:frontdesk' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21V11l9-6 9 6v10"/><path d="M8 21v-6h8v6"/></svg>
      Front desk
    </a>
  </nav>
  <div class="sidebar-foot">
    Signed in as {{ user.get_username }}<br>school admin
    <form class="logout-form" method="post" action="{% url 'SAAS_admin:logout' %}">
      {% csrf_token %}
      <button type="submit" class="logout-btn">Log out</button>
    </form>
  </div>
</aside>
