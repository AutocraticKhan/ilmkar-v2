<aside class="sidebar">
  <div class="brand">
    <span class="mark">ILMKAR</span>
    <span class="sub">{{ chain.name }}</span>
  </div>
  <nav class="nav">
    <a class="{% if nav_active == 'overview' %}active{% endif %}" href="{% url 'school_owner:dashboard' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-8h6v8"/></svg>
      Overview
    </a>
    <a class="{% if nav_active == 'financials' %}active{% endif %}" href="{% url 'school_owner:financials' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M17 5.5c-1-1-2.8-1.5-5-1.5-3 0-5 1.3-5 3.5S9 11 12 11s5 1.3 5 3.5-2 3.5-5 3.5c-2.2 0-4-.5-5-1.5"/></svg>
      Financials
    </a>
    <a class="{% if nav_active == 'transfers' %}active{% endif %}" href="{% url 'school_owner:transfers' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h13M14 3.5 17.5 7 14 10.5"/><path d="M20 17H7M10 13.5 6.5 17l3.5 3.5"/></svg>
      Transfers
    </a>
    <a class="{% if nav_active == 'policies' %}active{% endif %}" href="{% url 'school_owner:policies' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-3-6 3V3Z"/><path d="M9.5 8.5 12 11l3-4"/></svg>
      Policies
    </a>
    <a class="{% if nav_active == 'hiring' %}active{% endif %}" href="{% url 'school_owner:hiring' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c1.3-3.6 4.1-5.5 6.5-5.5s5.2 1.9 6.5 5.5"/><path d="M18 5v6M21 8h-6"/></svg>
      Hiring
    </a>
    <a class="{% if nav_active == 'announcements' %}active{% endif %}" href="{% url 'school_owner:announcements' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10v4l11 5V5L3 10Z"/><path d="M14 8.5c2.5.5 4 1.8 4 3.5s-1.5 3-4 3.5"/><path d="M7 14.5V19a1.5 1.5 0 0 0 3 0v-3"/></svg>
      Announcements
    </a>
    <a class="{% if nav_active == 'approvals' %}active{% endif %}" href="{% url 'school_owner:approvals' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6 9 17l-5-5"/></svg>
      Approvals
      {% if pending_approvals %}<span class="nav-badge">{{ pending_approvals }}</span>{% endif %}
    </a>
  </nav>
  <div class="sidebar-foot">
    Signed in as {{ user.get_username }}<br>group owner
    <form class="logout-form" method="post" action="{% url 'SAAS_admin:logout' %}">
      {% csrf_token %}
      <button type="submit" class="logout-btn">Log out</button>
    </form>
  </div>
</aside>
