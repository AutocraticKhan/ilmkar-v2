<aside class="sidebar">
  <div class="brand">
    <span class="mark">ILMKAR</span>
    <span class="sub">{{ school.name }}</span>
  </div>
  <nav class="nav">
    <a class="{% if nav_active == 'overview' %}active{% endif %}" href="{% url 'Student:dashboard' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-8h6v8"/></svg>
      Today
    </a>
    <a class="{% if nav_active == 'timetable' %}active{% endif %}" href="{% url 'Student:timetable' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      Timetable
    </a>
    <a class="{% if nav_active == 'assignments' %}active{% endif %}" href="{% url 'Student:assignments' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-3-6 3V3Z"/></svg>
      Assignments
    </a>
    <a class="{% if nav_active == 'results' %}active{% endif %}" href="{% url 'Student:results' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H6v18h12V7l-4-4Z"/><path d="M9 12h6M9 16h4"/></svg>
      Results
    </a>
    <a class="{% if nav_active == 'attendance' %}active{% endif %}" href="{% url 'Student:attendance' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6 9 17l-5-5"/></svg>
      Attendance
    </a>
    <a class="{% if nav_active == 'library' %}active{% endif %}" href="{% url 'Student:library' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19a2 2 0 0 0 2 2h13"/></svg>
      Library
    </a>
    <a class="{% if nav_active == 'fees' %}active{% endif %}" href="{% url 'Student:fees' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M17 5.5c-1-1-2.8-1.5-5-1.5-3 0-5 1.3-5 3.5S9 11 12 11s5 1.3 5 3.5-2 3.5-5 3.5c-2.2 0-4-.5-5-1.5"/></svg>
      Fee status
    </a>
    <a class="{% if nav_active == 'notices' %}active{% endif %}" href="{% url 'Student:notices' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11 21 5v12L3 13v-2Z"/><path d="M7 13v5a2 2 0 0 0 4 0"/></svg>
      Notices
    </a>
    <a class="{% if nav_active == 'quizzes' %}active{% endif %}" href="{% url 'Student:quizzes' %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 9a3 3 0 1 1 4.5 2.6c-.9.5-1.5 1-1.5 2.1"/><circle cx="12" cy="17.5" r=".5"/><circle cx="12" cy="12" r="10"/></svg>
      Quizzes
    </a>
  </nav>
  <div class="sidebar-foot">
    Signed in as {{ user.get_username }}<br>{% if student %}{{ student.full_name }} · {{ student.class_section.label|default:"—" }}{% else %}student (not linked){% endif %}
    <form class="logout-form" method="post" action="{% url 'SAAS_admin:logout' %}">
      {% csrf_token %}
      <button type="submit" class="logout-btn">Log out</button>
    </form>
  </div>
</aside>
