{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — ILMKAR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'SAAS_admin/css/login.css' %}">
</head>
<body>

<main class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark">ILMKAR</span>
      <span class="sub">operator console</span>
    </div>

    <h1>Sign in</h1>
    <p class="hint">Operator access only. Use your superuser account.</p>

    {% if error %}
      <div class="alert" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'SAAS_admin:home' %}">
      {% csrf_token %}
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>
  <p class="foot">ILMKAR registry &middot; restricted area</p>
</main>

</body>
</html>
