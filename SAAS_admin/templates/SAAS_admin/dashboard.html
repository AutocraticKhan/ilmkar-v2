{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registry — ILMKAR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'SAAS_admin/css/dashboard.css' %}">
</head>
<body data-csrf-token="{{ csrf_token }}">

<div class="shell">

  {% include "SAAS_admin/_sidebar.html" with nav_active="schools" %}

  <main class="main">

    <div class="topline">
      <div>
        <h1>School registry</h1>
        <p id="subhead">Loading&hellip;</p>
      </div>
      <button class="btn" onclick="openNewSchoolDrawer()">Add school</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Search by school name or city&hellip;">
      </div>
      <select id="packageFilter">
        <option value="all">All packages</option>
        <option value="Starter">Starter</option>
        <option value="Growth">Growth</option>
        <option value="Enterprise">Enterprise</option>
      </select>
      <select id="statusFilter">
        <option value="all">All statuses</option>
        <option value="active">Active</option>
        <option value="trial">Trial</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="name">School <span class="arrow" data-arrow="name"></span></th>
            <th data-key="package">Package <span class="arrow" data-arrow="package"></span></th>
            <th data-key="students">Students <span class="arrow" data-arrow="students"></span></th>
            <th data-key="mrr">MRR <span class="arrow" data-arrow="mrr"></span></th>
            <th data-key="renewal">Renews <span class="arrow" data-arrow="renewal"></span></th>
            <th data-key="status">Status <span class="arrow" data-arrow="status"></span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none">
        <h3 id="emptyTitle">No schools match this filter</h3>
        <p id="emptyText">Try a different search term or clear a filter.</p>
      </div>
    </div>

  </main>
</div>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<div class="toast" id="toast"></div>

{{ schools|json_script:"schools-data" }}
<script src="{% static 'SAAS_admin/js/dashboard.js' %}"></script>

</body>
</html>
